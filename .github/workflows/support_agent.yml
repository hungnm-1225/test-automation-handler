name: PTV Feedback 24/7 Cloud Automation

on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  # Nâng lên 3.11 để hết báo lỗi warning

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # Dùng Python ghi file trực tiếp để không bao giờ bị méo dấu ngoặc kép " "
      - name: Create credentials.json safely
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          python -c "import os; open('credentials.json', 'w').write(os.environ['GOOGLE_CREDS'])"

      - name: Run 30m Feedback Scan
        if: github.event.schedule != '0 15 * * *'
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --mode=scan

      - name: Run 22:00 Daily Executive Report
        if: github.event.schedule == '0 15 * * *'
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --mode=daily_report
